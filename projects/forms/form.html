<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <header>
        <h1>Job Application Form</h1>
    </header>
    <main>
        <form action="formprocessing.html" method="post">
            <fieldset>
                <legend>Job Application</legend>
            <div class="form-row">
                <label for="personname">Full Name</label>
                <input type="text" id="personname" name="fullname" placeholder="Full Name">
            </div>
            <div class="form-row">
                <label for="bdate">Birthday</label>
                <input type="date" id="bdate" name="bdate">
            </div>
            <div class="form-row">
                <label for="Address">Current Address</label>
                <input type="text" id="Address" name="address" placeholder="Current Address">
            </div>
            
            </fieldset>
        </form>
    </main>
</body>
</html>
